name: Android Debug APK
# 说明：上游 release.yml 的 android job 依赖 ANDROID_KEY_* secrets，fork 后必然失败。
# 这个独立工作流改用 Gradle debug 签名，产出可直接安装的 APK，不需要任何 secret。
on:
  workflow_dispatch:

env:
  CI: "true"

jobs:
  android:
    name: Android (debug-signed APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 准备 Android SDK / NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
          ls "$SDK/ndk"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android-debug

      - run: pnpm install --frozen-lockfile

      - name: 生成 Android 工程
        run: pnpm tauri android init --ci

      - name: 编译 debug APK（Gradle 自动 debug 签名）
        run: pnpm tauri android build --apk --debug --target aarch64

      - name: 收集 APK
        run: |
          mkdir -p artifacts
          find src-tauri/gen/android -name '*.apk' -not -path '*/intermediates/*' -exec cp -v {} artifacts/ \;
          ls -lh artifacts
          test -n "$(ls -A artifacts)"

      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: artifacts/*
          if-no-files-found: error
